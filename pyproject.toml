[project]
name = "morphos"
version = "0.1.0"
description = "Autonomous agent evolution laboratory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.1",
  "sse-starlette>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = [".", "core"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["core"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="100%" stop-color="#0F121C" />
    </linearGradient>
    <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="40" fill="url(#logo-bg)" stroke="#1E293B" stroke-width="2" />
  
  <g transform="translate(100, 100)" filter="url(#logo-glow)">
    <!-- Outer Hexagon Pulse -->
    <polygon points="0,-64 55.4,-32 55.4,32 0,64 -55.4,32 -55.4,-32" fill="none" stroke="url(#logo-cyan)" stroke-width="3" opacity="0.8" />
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#00F0FF" fill-opacity="0.06" stroke="#00FFA3" stroke-width="1.8" />
    
    <!-- Central Evolutionary Node Structure -->
    <circle cx="0" cy="0" r="28" fill="#0A0D16" stroke="url(#logo-cyan)" stroke-width="2.5" />
    <circle cx="0" cy="-36" r="5.5" fill="#00FFA3" />
    <circle cx="31.2" cy="18" r="5.5" fill="#00F0FF" />
    <circle cx="-31.2" cy="18" r="5.5" fill="#7000FF" />
    
    <!-- DNA crossing -->
    <path d="M -15 -15 Q 0 0 15 15 M -15 15 Q 0 0 15 -15" stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D" />
      <stop offset="50%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00B8FF" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <linearGradient id="text-mask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />
  <rect width="1200" height="400" fill="url(#dots)" rx="16" />

  <!-- Ambient Light Blobs -->
  <circle cx="180" cy="200" r="160" fill="#00F0FF" fill-opacity="0.07" filter="url(#glow-strong)" />
  <circle cx="1020" cy="220" r="180" fill="#7000FF" fill-opacity="0.08" filter="url(#glow-strong)" />
  <circle cx="600" cy="180" r="130" fill="#00FFA3" fill-opacity="0.04" filter="url(#glow-strong)" />

  <!-- Decorative Circuit Vectors (Left & Right) -->
  <g opacity="0.4">
    <path d="M 40 120 L 110 120 L 160 170 L 160 240 L 110 290 L 40 290" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="110" cy="120" r="4" fill="#00F0FF" />
    <circle cx="160" cy="170" r="3" fill="#00FFA3" />
    <circle cx="160" cy="240" r="3" fill="#00F0FF" />
    <circle cx="110" cy="290" r="4" fill="#7000FF" />

    <path d="M 1160 120 L 1090 120 L 1040 170 L 1040 240 L 1090 290 L 1160 290" fill="none" stroke="#7000FF" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="1090" cy="120" r="4" fill="#7000FF" />
    <circle cx="1040" cy="170" r="3" fill="#00F0FF" />
    <circle cx="1040" cy="240" r="3" fill="#FF8800" />
    <circle cx="1090" cy="290" r="4" fill="#00FFA3" />
  </g>

  <!-- Central Emblem: Morphing Cybernetic Organism Glyph -->
  <g transform="translate(600, 105)" filter="url(#glow-subtle)">
    <!-- Outer Hexagon Pulse -->
    <polygon points="0,-48 41.5,-24 41.5,24 0,48 -41.5,24 -41.5,-24" fill="none" stroke="url(#neon-cyan)" stroke-width="2" opacity="0.7" />
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#00F0FF" fill-opacity="0.05" stroke="#00FFA3" stroke-width="1.2" />
    
    <!-- Dynamic DNA / Node Loop -->
    <circle cx="0" cy="0" r="22" fill="#0A0D16" stroke="url(#neon-cyan)" stroke-width="2" />
    <circle cx="0" cy="-28" r="4" fill="#00FFA3" />
    <circle cx="24" cy="14" r="4" fill="#00F0FF" />
    <circle cx="-24" cy="14" r="4" fill="#7000FF" />
    
    <path d="M -12 -12 Q 0 0 12 12 M -12 12 Q 0 0 12 -12" stroke="#00FFA3" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" filter="url(#glow-subtle)" />
  </g>

  <!-- Typography Header: MORPHOS -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="14" fill="url(#text-mask)">
    MORPHOS
  </text>

  <!-- Subtitle -->
  <text x="600" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#00F0FF">
    AUTONOMOUS AGENT EVOLUTION LABORATORY
  </text>

  <!-- Tagline -->
  <text x="600" y="278" text-anchor="middle" font-family="Georgia, Cambria, Times, serif" font-style="italic" font-size="19" fill="#94A3B8">
    &quot;Don&apos;t build an agent. Evolve one.&quot;
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 332)">
    <!-- Pill 1: Autonomous Loop -->
    <g transform="translate(-375, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#131826" stroke="#1E293B" stroke-width="1" />
      <circle cx="-65" cy="0" r="4" fill="#00F0FF" />
      <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">AUTONOMOUS LOOP</text>
    </g>

    <!-- Pill 2: Multi-Objective Pareto -->
    <g transform="translate(-125, 0)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#131826" stroke="#1E293B" stroke-width="1" />
      <circle cx="-75" cy="0" r="4" fill="#00FFA3" />
      <text x="-62" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">PARETO OPTIMIZATION</text>
    </g>

    <!-- Pill 3: Epistemic Memory -->
    <g transform="translate(125, 0)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#131826" stroke="#1E293B" stroke-width="1" />
      <circle cx="-75" cy="0" r="4" fill="#7000FF" />
      <text x="-62" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">EPISTEMIC MEMORY BANK</text>
    </g>

    <!-- Pill 4: AST Hardened Sandbox -->
    <g transform="translate(375, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#131826" stroke="#1E293B" stroke-width="1" />
      <circle cx="-65" cy="0" r="4" fill="#FF8800" />
      <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">SANDBOX ISOLATION</text>
    </g>
  </g>

  <!-- Frame Outer Glow Line -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#neon-cyan)" stroke-width="1" stroke-opacity="0.25" />
</svg>